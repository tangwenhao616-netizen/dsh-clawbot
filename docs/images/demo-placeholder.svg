<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <rect width="800" height="400" fill="#f6f8fa" rx="12"/>
  <!-- Phone mockup -->
  <rect x="280" y="40" width="240" height="320" rx="24" fill="#1f2328"/>
  <rect x="290" y="60" width="220" height="280" rx="16" fill="#fff"/>
  <!-- WeChat header -->
  <rect x="290" y="60" width="220" height="44" rx="16" fill="#07c160"/>
  <text x="400" y="88" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">ClawBot</text>
  <!-- Chat bubbles -->
  <rect x="310" y="120" width="140" height="36" rx="8" fill="#f0f0f0"/>
  <text x="320" y="143" fill="#1f2328" font-size="12" font-family="system-ui">/new work</text>
  <rect x="350" y="170" width="140" height="48" rx="8" fill="#95ec69"/>
  <text x="360" y="190" fill="#1f2328" font-size="11" font-family="system-ui">✨ 已新建并切换到</text>
  <text x="360" y="205" fill="#1f2328" font-size="11" font-family="system-ui">「work」，直接发消息吧</text>
  <rect x="310" y="235" width="160" height="36" rx="8" fill="#f0f0f0"/>
  <text x="320" y="258" fill="#1f2328" font-size="12" font-family="system-ui">帮我写一份周报</text>
  <rect x="340" y="285" width="150" height="60" rx="8" fill="#95ec69"/>
  <text x="350" y="305" fill="#1f2328" font-size="11" font-family="system-ui">好的，这是您的周报：</text>
  <text x="350" y="320" fill="#1f2328" font-size="11" font-family="system-ui">1. 完成了...</text>
  <text x="350" y="335" fill="#1f2328" font-size="11" font-family="system-ui">2. 正在进行...</text>
  <!-- Arrow and labels -->
  <text x="150" y="200" text-anchor="middle" fill="#656d76" font-size="14" font-family="system-ui">1. Scan QR Code</text>
  <text x="150" y="220" text-anchor="middle" fill="#656d76" font-size="14" font-family="system-ui">in WeChat</text>
  <text x="650" y="200" text-anchor="middle" fill="#656d76" font-size="14" font-family="system-ui">2. Chat with</text>
  <text x="650" y="220" text-anchor="middle" fill="#656d76" font-size="14" font-family="system-ui">your AI agent</text>
  <text x="400" y="380" text-anchor="middle" fill="#656d76" font-size="12" font-family="system-ui">Replace this placeholder with a real screenshot or GIF</text>
</svg>
